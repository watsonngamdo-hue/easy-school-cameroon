{% extends 'dash/base.html' %}
{% load static %}

{% block content %}
<div class="mdk-drawer-layout__content page-content">
    <div class="container-fluid">
        <h1 class="h2">Assistant AI</h1>
        <div class="card">
            <div class="card-header">
                <div class="d-flex align-items-center">
                    <div class="flex">
                        <h4 class="card-title">Chat</h4>
                        <p class="card-subtitle text-muted">Crédits Journaliers: <span id="daily-credits">{{ daily_credits }}</span> | Portefeuille: <span id="wallet-credits">{{ wallet_credits }}</span></p>
                    </div>
                </div>
            </div>
            <div class="card-body" style="height: 400px; overflow-y: auto;" id="chat-box">
                <!-- Chat messages will appear here -->
                <div class="media">
                    <div class="media-body">
                        <p class="text-muted">Posez-moi une question ! (1 crédit par message)</p>
                    </div>
                </div>
            </div>
            <div class="card-footer">
                <form id="chat-form">
                    <div class="input-group input-group-merge">
                        <input type="text" class="form-control form-control-prepended" id="user-input" placeholder="Écrivez votre message...">
                        <div class="input-group-btn">
                            <button type="submit" class="btn btn-primary">Envoyer</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    const chatForm = document.getElementById('chat-form');
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const dailyCreditsSpan = document.getElementById('daily-credits');
    const walletCreditsSpan = document.getElementById('wallet-credits');

    function appendMessage(sender, text) {
        const div = document.createElement('div');
        div.className = 'media';
        let content = '';
        if (sender === 'User') {
            content = `<div class="media-body text-right"><span class="badge badge-primary" style="font-size: 1em; padding: 10px; border-radius: 10px; display: inline-block; text-align: left; max-width: 80%;">${text}</span></div>`;
        } else {
            content = `<div class="media-body"><span class="badge badge-light" style="font-size: 1em; padding: 10px; border-radius: 10px; border: 1px solid #ddd; display: inline-block; max-width: 80%; white-space: pre-wrap;">${text}</span></div>`;
        }
        div.innerHTML = content;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    chatForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const message = userInput.value;
        if (!message) return;

        appendMessage('User', message);
        userInput.value = '';

        fetch("{% url 'aiapp:chat' %}", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-Requested-With': 'XMLHttpRequest',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({ message: message })
        })
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                appendMessage('AI', 'Erreur: ' + data.error);
            } else {
                appendMessage('AI', data.response);
                dailyCreditsSpan.innerText = data.daily_credits;
                walletCreditsSpan.innerText = data.wallet_credits;
            }
        })
        .catch(error => {
            console.error('Error:', error);
            appendMessage('AI', 'Erreur de connexion.');
        });
    });
</script>
{% endblock %}
